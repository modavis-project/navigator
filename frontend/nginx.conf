upstream navigator_backend {
    zone navigator_backend 256k;
    # Docker service addresses can change when the backend is recreated.
    # Dynamic resolution is available in open-source Nginx >= 1.27.3.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;
    server navigator-backend:8506 resolve;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/javascript application/json application/ld+json image/svg+xml text/css text/plain;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    add_header_inherit merge;

    location /api/ {
        proxy_pass http://navigator_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /dataset/ {
        proxy_pass http://navigator_backend/dataset/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sitemap.xml {
        proxy_pass http://navigator_backend/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /vocab/event-type/ {
        proxy_pass http://navigator_backend/vocab/event-type/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /resolve/ {
        proxy_pass http://navigator_backend/resolve/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location ~* ^/assets/.+\.(?:css|js|svg|png|webp|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ^~ /data/ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location = /geolibre {
        return 301 /geolibre/;
    }

    location ^~ /geolibre/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ^~ /geolibre/ {
        try_files $uri $uri/ /geolibre/index.html;
    }

    location = /navigator-api.md {
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
