upstream navigator_backend {
    zone navigator_backend 256k;
    # Docker service addresses can change when the backend is recreated.
    # Dynamic resolution is available in open-source Nginx >= 1.27.3.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;
    server navigator-backend:8506 resolve;
}

upstream navigator_openfreemap {
    zone navigator_openfreemap 64k;
    resolver 127.0.0.11 valid=60s ipv6=off;
    resolver_timeout 3s;
    server tiles.openfreemap.org:443 resolve;
}

proxy_cache_path /var/cache/nginx/navigator-basemap levels=1:2 keys_zone=navigator_basemap:4m max_size=96m inactive=7d use_temp_path=off;

map $http_x_forwarded_proto $navigator_basemap_scheme {
    https https;
    default $scheme;
}

map $http_host $navigator_basemap_authority {
    "~^(?:[a-zA-Z0-9.-]+|\[[a-fA-F0-9:.]+\])(?::[0-9]{1,5})?$" $http_host;
    default $server_addr;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/javascript application/json application/geo+json application/ld+json application/vnd.mapbox-vector-tile application/x-protobuf image/svg+xml text/css text/plain;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    add_header_inherit merge;

    location /api/ {
        proxy_pass http://navigator_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ "^/api/(?:map/marker-style\.json|areas/[^/]+/map/style\.json)$" {
        proxy_pass http://navigator_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $navigator_basemap_authority;
        proxy_set_header X-Forwarded-Proto $navigator_basemap_scheme;
    }

    location /dataset/ {
        proxy_pass http://navigator_backend/dataset/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sitemap.xml {
        proxy_pass http://navigator_backend/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /vocab/event-type/ {
        proxy_pass http://navigator_backend/vocab/event-type/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /resolve/ {
        proxy_pass http://navigator_backend/resolve/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location ~* ^/assets/.+\.(?:css|js|svg|png|webp|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ^~ /data/ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location = /geolibre {
        return 301 /geolibre/;
    }

    location ^~ /geolibre/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ^~ /geolibre/ {
        try_files $uri $uri/ /geolibre/index.html;
    }

    location = /geolibre-region-bridge.mjs {
        types { application/javascript mjs; }
        try_files $uri =404;
    }

    location ^~ /basemap/assets-v2/ {
        types {
            application/geo+json geojson;
            application/json json;
            text/plain txt;
        }
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;

        location = /basemap/assets-v2/style.json {
            # MapLibre resolves sprite suffixes against an absolute URL.
            gzip_static off;
            sub_filter_types application/json;
            sub_filter '"/basemap/openfreemap/v2/sprites/ofm_f384/ofm"' '"$navigator_basemap_scheme://$navigator_basemap_authority/basemap/openfreemap/v2/sprites/ofm_f384/ofm"';
        }
    }

    location ^~ /basemap/openfreemap/v2/ {
        types {
            application/x-protobuf pbf;
            text/plain md;
        }
        limit_except GET { deny all; }
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri @navigator_basemap_relay;
    }

    location @navigator_basemap_relay {
        # Only visible map assets can use this fixed-origin relay. Readers'
        # cookies, headers and arbitrary query strings never leave Navigator.
        rewrite "^/basemap/openfreemap/v2/(planet|planet/[0-9]{8}_[0-9]{6}_[a-z]{2}/(?:[0-9]|1[0-4])/[0-9]{1,5}/[0-9]{1,5}\.pbf|fonts/Noto Sans (?:Regular|Bold|Italic)/[0-9]{1,6}-[0-9]{1,6}\.pbf|sprites/ofm_f384/ofm(?:@2x)?\.(?:json|png))$" /$1? break;
        return 404;

        proxy_pass https://navigator_openfreemap;
        proxy_ssl_server_name on;
        proxy_ssl_name tiles.openfreemap.org;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_connect_timeout 3s;
        proxy_read_timeout 7s;
        proxy_pass_request_headers off;
        proxy_set_header Host tiles.openfreemap.org;
        proxy_set_header User-Agent "MODAVIS Navigator (https://navigator.modavis.org)";
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Alt-Svc;
        proxy_hide_header NEL;
        proxy_hide_header Report-To;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Strict-Transport-Security;

        proxy_cache navigator_basemap;
        proxy_cache_key $uri;
        proxy_cache_lock on;
        proxy_cache_revalidate on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_valid 200 10m;

        sub_filter_types application/json;
        sub_filter_once off;
        sub_filter 'https://tiles.openfreemap.org/planet/' '/basemap/openfreemap/v2/planet/';
    }

    location = /navigator-api.md {
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
